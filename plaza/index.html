<!--
============================================================
Página de INICIO · Sabores de la Plaza
Ejercicios 01, 02, 03, 07 y 08
============================================================
Sabores de la Plaza es un colectivo de puestos de una plaza de
mercado: fruteros, panadería, almuerzos, jugos naturales y café.
Quieren un sitio de tres páginas: index.html (esta), puestos.html
y contacto.html. Escribe tu HTML DEBAJO de este comentario.
Todo con Bootstrap: nada de JavaScript propio.

Ejercicio 01 · Bootstrap instalado (en las TRES páginas)
  - El esqueleto de siempre, con el <meta name="viewport">.
  - En el <head>: el CSS de Bootstrap 5 (cópialo de la documentación)
    y DESPUÉS tu <link href="styles.css" rel="stylesheet">.
  - Al final del <body>: el <script> de bootstrap.bundle.min.js.

Ejercicio 02 · Barra de navegación (idéntica en las TRES páginas)
  - Una navbar con navbar-expand-lg, la marca "Sabores de la Plaza"
    (clase navbar-brand) y el botón navbar-toggler para el celular.
  - El data-bs-target del botón apunta al id del div collapse.
  - Enlaces a index.html, puestos.html y contacto.html.

Ejercicio 03 · La bienvenida (solo en esta página)
  - Un banner (hero) con el único <h1> de esta página, una frase y un
    botón (clase btn) que lleve a puestos.html o a contacto.html.
  - Una fila con 3 o 4 bloques de presentación (fresco, local,
    hecho a mano…): uno debajo del otro en el celular y todos en
    una sola fila en el computador.
  - Un <footer> con los datos del colectivo.

Ejercicio 07 · El carrusel (aquí o en puestos.html)
  - El cliente quiere "fotos que pasen solas". Búscalo en
    Components → Carousel. Al menos 3 fotos, cada una con alt.
  - En plaza/img/ tienes 3 imágenes listas para usar.

Ejercicio 08 · La letra (en las TRES páginas)
  - El <link> de Google Fonts con tu fuente, en el <head>.
============================================================
-->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sabores de la Plaza</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">Sabores de la Plaza</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
        aria-controls="menuPrincipal" aria-expanded="false" aria-label="Alternar navegación">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuPrincipal">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link active" href="puestos.html">Puestos</a></li>
          <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <header class="bg-primary text-white text-center py-5">
    <div class="container py-4">
      <h1 class="display-4 fw-bold">Bienvenido</h1>
      
      <a href="puestos.html" class="btn btn-light btn-lg mt-2">Conoce nuestros puestos</a>
    </div>
  </header>
  <section class="container my-5">
    <div class="row g-4 text-center">
      <div class="col-12 col-md-4">
        <div class="p-4 border rounded h-100">
          <h2 class="h4">Fresco</h2>
        
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="p-4 border rounded h-100">
          <h2 class="h4">Local</h2>
          
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="p-4 border rounded h-100">
          <h2 class="h4">Hecho a mano</h2>
          
        </div>
      </div>
    </div>
  </section>
  <section class="container my-5">
    <h2 class="text-center mb-4">Un vistazo a la plaza</h2>
    <div id="carruselPlaza" class="carousel slide" data-bs-ride="carousel">
      <div class="carousel-indicators">
        <button type="button" data-bs-target="#carruselPlaza" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Foto 1"></button>
        <button type="button" data-bs-target="#carruselPlaza" data-bs-slide-to="1" aria-label="Foto 2"></button>
        <button type="button" data-bs-target="#carruselPlaza" data-bs-slide-to="2" aria-label="Foto 3"></button>
      </div>
      <div class="carousel-inner rounded">
        <div class="carousel-item active">
          <img src="plaza/img/frutas.svg" class="d-block w-100" alt="Puesto de frutas con productos frescos">
        </div>
        <div class="carousel-item">
          <img src="plaza/img/pan.svg" class="d-block w-100" alt="Panadería con pan recién horneado">
        </div>
        <div class="carousel-item">
          <img src="plaza/img/cafe.svg" class="d-block w-100" alt="Cafe">
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#carruselPlaza" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Anterior</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#carruselPlaza" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Siguiente</span>
      </button>
    </div>
  </section>


  <footer class="text-center py-4">
    <p>&copy; 2024 Sabores de la Plaza. Todos los derechos reservados.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
